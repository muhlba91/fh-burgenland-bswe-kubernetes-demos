---
# see: https://github.com/argoproj/argo-helm/blob/main/charts/argocd-apps/values.yaml
applications:
  gitea:
    namespace: argocd
    project: default
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    destination:
      namespace: gitea-argocd
      server: https://kubernetes.default.svc
    sources:
      - chart: gitea
        repoURL: https://dl.gitea.com/charts/
        targetRevision: 12.7.0
        helm:
          releaseName: gitea
          valueFiles:
            - $values/applications/gitea/helm/values.yml
      - ref: values
        repoURL: https://github.com/muhlba91/hochschule-burgenland-kubernetes-demos.git
        targetRevision: HEAD
    syncPolicy:
      automated:
        prune: false
        selfHeal: false
        allowEmpty: false
      syncOptions:
        - CreateNamespace=true
        - FailOnSharedResource=true
